[package]
name = "nmraster"
version = "0.1.0"
description = "Next-generation NMR platform with simultaneous multi-experiment analysis"
authors = ["you"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "nmraster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "test_assignment"
path = "src/bin/test_assignment.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Async Runtime
tokio = { version = "1.42", features = ["full", "sync", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Matrix/Array Operations
ndarray = { version = "0.16", features = ["serde"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# Scientific Computing
num = "0.4"
num-complex = { version = "0.4", features = ["serde"] }
rustfft = "6.2"
realfft = "3.4"

# Database
rusqlite = { version = "0.32", features = ["bundled", "blob", "array"] }
rusqlite_migration = "1.3"

# Graph Data Structures
petgraph = { version = "0.6", features = ["serde-1"] }

# ML Integration (using latest RC until 2.0 stable)
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
blake3 = "1.5"
rand = "0.9.2"

# CLI for test binary
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"
tempfile = "3.14"

# Benchmarks will be added later
# [[bench]]
# name = "fft_benchmark"
# harness = false
